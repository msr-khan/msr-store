<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSR App Store</title>
    <meta name="description" content="MSR App Store is a store for  apps, tools and games built by an independent developer." />
    <meta name="google-site-verification" content="ZfRgiY75XHvk4V-Ks_5XAwE8FePRrPBcV2sBa8XcH44" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Basic SEO / Open Graph defaults (edit per deployment) -->
    <meta property="og:title" content="MSR App Store" />
    <meta property="og:description" content="Browse and install  apps, tools and games." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('msr-store-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
